- name: Configurar monitoramento
  hosts: server
  become: yes

  tasks:
    - name: Atualizar cache do apt
      apt:
        update_cache: yes

    - name: Instalar dependências
      apt:
        name:
          - curl
          - stress-ng
        state: present

    - name: Instalar Netdata
      shell: |
        bash <(curl -Ss https://get.netdata.cloud/kickstart.sh) --non-interactive
      args:
        executable: /bin/bash

    - name: Garantir serviço iniciado
      service:
        name: netdata
        state: started
        enabled: yes

    - name: Criar alerta de CPU acima de 80%
      copy:
        dest: /etc/netdata/health.d/cpu_overload.conf
        content: |
          alarm: cpu_overload
          on: system.cpu
          lookup: average -1m percentage of user
          every: 10s
          warn: $this > 80
          info: CPU acima de 80%
          to: sysadmin

    - name: Reiniciar Netdata
      service:
        name: netdata
        state: restarted